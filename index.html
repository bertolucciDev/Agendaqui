<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="%BASE_URL%agendaqui-icon.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%agendaqui-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agendaqui</title>
    <script>
      // FE-01: anti-flash — aplica classe de tema antes do primeiro paint
      try {
        var t = localStorage.getItem('agendaqui:theme');
        t = (t === 'light' || t === 'dark' || t === 'system') ? t : 'system';
        var dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
        else document.documentElement.classList.remove('dark');
      } catch (_) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
